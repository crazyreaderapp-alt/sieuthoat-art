<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#233026"/><stop offset="60%" stop-color="#121a14"/><stop offset="100%" stop-color="#070b08"/>
