    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity=".7"/><stop offset="60%" stop-color="#f0c75e" stop-opacity=".2"/><stop offset="100%" stop-color="#f0c75e" stop-opacity="0"/>
