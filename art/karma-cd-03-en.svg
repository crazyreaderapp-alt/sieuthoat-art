<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#3a2c12"/><stop offset="55%" stop-color="#1c1610"/><stop offset="100%" stop-color="#0c0a06"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc"/><stop offset="45%" stop-color="#ffd76a"/><stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a1a"/><stop offset="50%" stop-color="#ffe9a8"/><stop offset="100%" stop-color="#8a6a1a"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" fill="url(#bg)"/>
  <!-- vầng hào quang -->
  <g stroke="#ffd76a" opacity=".55" stroke-linecap="round">
    <g id="rays" stroke-width="3">
      <line x1="150" y1="30" x2="150" y2="70"/><line x1="150" y1="300" x2="150" y2="340"/>
      <line x1="30" y1="185" x2="70" y2="185"/><line x1="230" y1="185" x2="270" y2="185"/>
      <line x1="65" y1="100" x2="93" y2="128"/><line x1="207" y1="242" x2="235" y2="270"/>
      <line x1="235" y1="100" x2="207" y2="128"/><line x1="93" y1="242" x2="65" y2="270"/>
    </g>
  </g>
  <circle cx="150" cy="185" r="86" fill="url(#sun)" opacity=".9"/>
  <!-- kiếm chính khí cắm giữa mặt trời -->
  <g>
    <path d="M150 78 L162 150 L158 250 L150 268 L142 250 L138 150 Z" fill="url(#blade)"/>
    <rect x="128" y="252" width="44" height="10" rx="4" fill="#b98a1e"/>
    <rect x="144" y="262" width="12" height="34" rx="5" fill="#8a6a1a"/>
    <circle cx="150" cy="304" r="8" fill="#ffd76a"/>
  </g>
  <!-- mây lành -->
  <g fill="none" stroke="#ffe9a8" stroke-width="2.5" opacity=".6">
    <path d="M70 330 q20 -14 40 0 q20 -14 40 0"/>
    <path d="M150 330 q20 -14 40 0 q20 -14 40 0"/>
  </g>
  <rect x="14" y="14" width="272" height="392" fill="none" stroke="#f0c75e" stroke-width="3" opacity=".7"/>
  <rect x="22" y="22" width="256" height="376" fill="none" stroke="#f0c75e" stroke-width="1" opacity=".35"/>
  <text x="150" y="372" text-anchor="middle" font-family="serif" font-size="24" fill="#f0c75e" letter-spacing="4">RIGHTEOUS QI</text>
