  </defs>
  <rect width="300" height="420" fill="url(#bg)"/>
  <!-- 3 vòng hào quang -->
  <circle cx="150" cy="180" r="122" fill="none" stroke="#f0c75e" stroke-width="1.5" opacity=".35"/>
  <circle cx="150" cy="180" r="106" fill="none" stroke="#f0c75e" stroke-width="2.5" opacity=".55"/>
  <circle cx="150" cy="180" r="88" fill="url(#disc)"/>
