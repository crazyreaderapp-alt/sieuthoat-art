    <circle cx="150" cy="180" r="7" fill="#7a5a10" stroke="none"/>
    <line x1="150" y1="150" x2="150" y2="164"/><line x1="150" y1="196" x2="150" y2="210"/>
    <line x1="120" y1="180" x2="134" y2="180"/><line x1="166" y1="180" x2="180" y2="180"/>
    <line x1="129" y1="159" x2="139" y2="169"/><line x1="161" y1="191" x2="171" y2="201"/>
    <line x1="171" y1="159" x2="161" y2="169"/><line x1="139" y1="191" x2="129" y2="201"/>
  </g>
  <!-- đài sen -->
  <g fill="none" stroke="#f0c75e" stroke-width="3" opacity=".8">
