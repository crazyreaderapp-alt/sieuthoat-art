<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1e0b1e"/><stop offset="60%" stop-color="#100510"/><stop offset="100%" stop-color="#070307"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity=".5"/><stop offset="60%" stop-color="#5a1e7a" stop-opacity=".2"/><stop offset="100%" stop-color="#5a1e7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a6e"/><stop offset="60%" stop-color="#a3122a"/><stop offset="100%" stop-color="#4a0812"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" fill="url(#bg)"/>
  <circle cx="150" cy="185" r="115" fill="url(#aura)"/>
  <!-- tim bị tà chú ăn mòn -->
  <g>
    <path d="M150 260 Q95 215 95 160 Q95 115 130 115 Q150 115 150 140 Q150 115 170 115 Q205 115 205 160 Q205 215 150 260 Z" fill="url(#heart)" stroke="#2a0d14" stroke-width="3"/>
    <!-- vết nứt tà khí -->
    <g stroke="#0a0305" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M120 140 L138 175 L128 205 L148 230"/>
      <path d="M175 135 L162 170 L178 200"/>
    </g>
    <g stroke="#9d4edd" stroke-width="2" opacity=".8" fill="none">
      <path d="M120 140 L138 175 L128 205 L148 230"/>
      <path d="M175 135 L162 170 L178 200"/>
    </g>
  </g>
  <!-- tà chú xoay quanh -->
  <g fill="none" stroke="#9d4edd" stroke-width="2.5" opacity=".7">
    <path d="M70 185 a80 80 0 0 1 40 -69"/>
    <path d="M230 185 a80 80 0 0 0 -40 69"/>
    <circle cx="70" cy="185" r="5" fill="#9d4edd" stroke="none"/>
    <circle cx="230" cy="185" r="5" fill="#9d4edd" stroke="none"/>
  </g>
  <!-- ấn bùa vector 4 góc (thay chữ Hán — không phụ thuộc font) -->
  <g fill="none" stroke="#c77dff" stroke-width="2.5" opacity=".85">
    <path d="M86 96 l10 10 l-10 10 l-10 -10 Z"/><circle cx="86" cy="106" r="2.5" fill="#c77dff" stroke="none"/>
    <path d="M214 96 l10 10 l-10 10 l-10 -10 Z"/><circle cx="214" cy="106" r="2.5" fill="#c77dff" stroke="none"/>
    <path d="M86 264 l10 10 l-10 10 l-10 -10 Z"/><circle cx="86" cy="274" r="2.5" fill="#c77dff" stroke="none"/>
    <path d="M214 264 l10 10 l-10 10 l-10 -10 Z"/><circle cx="214" cy="274" r="2.5" fill="#c77dff" stroke="none"/>
  </g>
  <rect x="14" y="14" width="272" height="392" fill="none" stroke="#9d4edd" stroke-width="3" opacity=".8"/>
  <rect x="22" y="22" width="256" height="376" fill="none" stroke="#9d4edd" stroke-width="1" opacity=".4"/>
  <text x="150" y="372" text-anchor="middle" font-family="serif" font-size="18" fill="#c77dff" letter-spacing="4">HEART CORRUPTION</text>
